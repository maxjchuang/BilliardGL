<text x="348" y="110" class="primary">键鼠输入 / INPUT</text><text x="348" y="144" class="caption">选择一个动作后按新按键；同场景冲突会阻止保存。</text><text x="348" y="168" class="body">切换瞄准 / Toggle aim</text><rect x="907" y="140" width="285" height="44" rx="8" class="key"/><text x="927" y="168" class="body">Tab</text><text x="348" y="222" class="body">击球 / Shoot</text><rect x="907" y="194" width="285" height="44" rx="8" class="key"/><text x="927" y="222" class="body">Mouse Left Release</text><text x="348" y="276" class="body">调整力度 / Power</text><rect x="907" y="248" width="285" height="44" rx="8" class="key"/><text x="927" y="276" class="body">+ / −  ·  Wheel</text><text x="348" y="330" class="body">镜头环绕 / Orbit</text><rect x="907" y="302" width="285" height="44" rx="8" class="key"/><text x="927" y="330" class="body">Arrows  ·  Left Drag</text><text x="348" y="384" class="body">镜头平移 / Pan</text><rect x="907" y="356" width="285" height="44" rx="8" class="key"/><text x="927" y="384" class="body">A / D  ·  Shift Drag</text>
