<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">BilliardGL Phase 5 settings mockup minimum_1280x720_96dpi</title><desc id="desc">Input rebinding and accessibility settings with a non-color foul preview.</desc>
