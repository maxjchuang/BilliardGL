<title id="title">BilliardGL Phase 5 settings mockup reference_1920x1080_96dpi</title><desc id="desc">Input rebinding and accessibility settings with a non-color foul preview.</desc>
<style>.bg{fill:#0D1216}.panel{fill:#10181E;stroke:#64737D;stroke-width:2}.active{fill:#17353B;stroke:#31B7C8;stroke-width:3}.key{fill:#0B1116;stroke:#C1CBD0;stroke-width:2}.primary{fill:#F4F7F8;font-family:system-ui,sans-serif;font-size:32px;font-weight:600}.body{fill:#F4F7F8;font-family:system-ui,sans-serif;font-size:18px}.caption{fill:#C1CBD0;font-family:system-ui,sans-serif;font-size:14px}.warning{fill:#F2BC55}.danger{fill:#F06B5D}</style>
