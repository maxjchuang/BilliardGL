name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    # Keep the legacy Apple GLUT screenshot tests on the last known-good runner.
    # macos-latest moved to macOS 26, whose GLUT 3.0 adds incompatible checks.
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config glew sdl2 sdl2_mixer

      - name: Configure, build, and test
        env:
          BILLIARDGL_BUILD_DIR: ${{ runner.temp }}/billiardgl-build
        run: ./scripts/check.sh
